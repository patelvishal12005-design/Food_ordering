<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Food Item</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; background-color: #f8f9fa; }
        .container { max-width: 600px; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #ffc107; margin-bottom: 25px; }
        .btn-update { background-color: #ffc107; color: black; width: 100%; font-weight: bold; }
        .btn-update:hover { background-color: #e0a800; color: black; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1>Edit Food Item</h1>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Food Name</label>
                <input type="text" name="name" class="form-control" value="{{ food.name }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Price (₹)</label>
                <input type="number" step="0.01" name="price" class="form-control" value="{{ food.price }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="3" required>{{ food.description }}</textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Image Path</label>
                <input type="text" name="image" class="form-control" value="{{ food.image }}" required>
                <small class="text-muted">Ensure this file exists in your React public folder.</small>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-update">Update Food Item</button>
                <a href="/" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
