<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Menu Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; background-color: #f8f9fa; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #28a745; margin-bottom: 30px; }
        .btn-add { background-color: #28a745; color: white; margin-bottom: 20px; }
        .btn-add:hover { background-color: #218838; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Food List</h1>

        <div class="mb-4 d-flex justify-content-between align-items-center">
            <div>
                <a href="/add/" class="btn btn-add">+ Add New Food</a>
                <a href="/orders/" class="btn btn-outline-primary">View Customer Orders (MongoDB)</a>
            </div>
            <a href="/logout/" class="btn btn-outline-danger">Logout (Admin: {{ user.username }})</a>
        </div>

        <div class="table-responsive">
            <table class="table table-bordered table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Image</th>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for food in foods %}
                    <tr>
                        <td><img src="{{ food.image }}" width="60" height="60" style="object-fit: cover; border-radius: 5px;"></td>
                        <td>{{ food.name }}</td>
                        <td>₹{{ food.price }}</td>
                        <td>{{ food.description|truncatewords:10 }}</td>
                        <td>
                            <a href="/edit/{{ food.id }}/" class="btn btn-warning btn-sm">Edit</a>
                            <a href="/delete/{{ food.id }}/" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure?')">Delete</a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="5" class="text-center">No food items found.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
